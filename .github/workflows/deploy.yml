name: CI/CD - Userside

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # PHASE 1: Test/build check — runs on every PR and push
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build check
        run: npm run build

  # PHASE 2: Deploy — only runs after merge into main
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/userside
            git pull origin main
            npm install
            npm run build
            nginx -t && systemctl reload nginx